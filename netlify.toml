# Déploiement Netlify — seul le contenu de _site est servi.
# Les .md (stratégie, prix), le CRM, la trésorerie et tools/ ne sont jamais publiés.
[build]
  command = "bash tools/build-site.sh"
  publish = "_site"

# Les espaces partenaires ne doivent être ni indexés ni mis en cache par des intermédiaires.
[[headers]]
  for = "/espace-client*.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Offre médicale abandonnée (2026-10-30) : pages retirées du site, archivées dans
# 99-Archives-Medical/. Les anciennes URL renvoient vers les pages actives.
[[redirects]]
  from = "/simulateur-salverys.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/espace-client-medical.html"
  to = "/espace-client.html"
  status = 301
